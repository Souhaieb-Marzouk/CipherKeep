[advisories]
ignore = [
  { id = "RUSTSEC-2026-0374", reason = "unmaintained basic-toml is only pulled by the uniffi CLI build; it is not linked into shipped artifacts" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "MIT",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
