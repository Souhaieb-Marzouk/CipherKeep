name: build-firefox

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver version, for example 0.1.0
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: build-firefox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-xpi:
    name: AMO unlisted signed XPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
      AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/firefox-release
        with:
          version: ${{ inputs.version }}
