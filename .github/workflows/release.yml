name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Semver version, for example 0.1.0
        required: true
        default: 0.1.0
        type: string
      tag:
        description: Release tag, for example v0.1.0
        required: true
        default: v0.1.0
        type: string
      release_notes:
        description: Reviewed release notes (no unverified security claims)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate protected release inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.values.outputs.version }}
      tag: ${{ steps.values.outputs.tag }}
    steps:
      - name: Normalize version and tag
        id: values
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="$INPUT_VERSION"
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          fi
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "invalid semver: $version" >&2; exit 1; }
          echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "invalid tag: $tag" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  android:
    name: signed Android build
    needs: validate
    uses: ./.github/workflows/build-android.yml
    with:
      version: ${{ needs.validate.outputs.version }}
    secrets:
      CIPHERKEEP_KEYSTORE_BASE64: ${{ secrets.CIPHERKEEP_KEYSTORE_BASE64 }}
      CIPHERKEEP_KEYSTORE_PASSWORD: ${{ secrets.CIPHERKEEP_KEYSTORE_PASSWORD }}
      CIPHERKEEP_KEY_ALIAS: ${{ secrets.CIPHERKEEP_KEY_ALIAS }}
      CIPHERKEEP_KEY_PASSWORD: ${{ secrets.CIPHERKEEP_KEY_PASSWORD }}
      CIPHERKEEP_CERT_SHA256: ${{ secrets.CIPHERKEEP_CERT_SHA256 }}

  firefox:
    name: signed Firefox build
    needs: [validate, android]
    uses: ./.github/workflows/build-firefox.yml
    with:
      version: ${{ needs.validate.outputs.version }}
    secrets:
      AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
      AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}

  integrity:
    name: checksums, Minisign and draft
    needs: [validate, android, firefox]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      subjects: ${{ steps.subjects.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download signed build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cipherkeep-*
          merge-multiple: true
          path: release-assets

      - name: Install Minisign and flatten artifacts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign
          mkdir -p out
          find release-assets -type f -exec cp -t out {} +
          cd out
          find . -maxdepth 1 -type f ! -name 'checksums.txt' ! -name '*.minisig' -printf '%f\n' | sort |
            while IFS= read -r file; do sha256sum "$file"; done > checksums.txt
          cat checksums.txt

      - name: Sign checksums with offline Minisign key
        shell: bash
        env:
          MINISIGN_SECRET_KEY_BASE64: ${{ secrets.MINISIGN_SECRET_KEY_BASE64 }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${MINISIGN_SECRET_KEY_BASE64:-}" || { echo "missing Minisign secret" >&2; exit 1; }
          umask 077
          printf '%s' "$MINISIGN_SECRET_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/minisign.key"
          if [ -n "${MINISIGN_PASSWORD:-}" ]; then
            printf '%s' "$MINISIGN_PASSWORD" | minisign -S -s "$RUNNER_TEMP/minisign.key" \
              -m out/checksums.txt -x out/checksums.txt.minisig
          else
            minisign -S -W -s "$RUNNER_TEMP/minisign.key" \
              -m out/checksums.txt -x out/checksums.txt.minisig
          fi
          minisign -V -p release/minisign.pub -m out/checksums.txt -x out/checksums.txt.minisig
          rm -f "$RUNNER_TEMP/minisign.key"

      - name: Create draft release with reviewed notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release already exists; refusing to overwrite" >&2
            exit 1
          fi
          if [ -n "${RELEASE_NOTES:-}" ]; then
            gh release create "$TAG" \
              --draft \
              --title "CipherKeep $VERSION" \
              --notes "$RELEASE_NOTES"
          else
            gh release create "$TAG" \
              --draft \
              --title "CipherKeep $VERSION" \
              --generate-notes
          fi

      - name: Export provenance subject
        id: subjects
        shell: bash
        run: echo "value=$(base64 -w0 out/checksums.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload integrity bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-integrity
          if-no-files-found: error
          path: out/**

  provenance:
    name: SLSA Level 3 provenance
    needs: [validate, integrity]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.integrity.outputs.subjects }}
      upload-assets: true
      upload-tag-name: ${{ needs.validate.outputs.tag }}
      draft-release: "true"

  draft:
    name: assemble draft release
    needs: [validate, integrity, provenance]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download integrity bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-integrity
          path: release-integrity

      - name: Upload every artifact to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s release-integrity/checksums.txt
          test -s release-integrity/checksums.txt.minisig
          find release-integrity -maxdepth 1 -type f -print -exec gh release upload "$TAG" {} --clobber \;
          echo "Draft release: $SERVER_URL/$REPO/releases/tag/$TAG"
          echo "Maintainer must review and publish manually."
