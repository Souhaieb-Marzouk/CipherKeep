name: release-placeholder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: protected release placeholder
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Explain the P5 gate
        run: |
          echo "Release signing and publishing are implemented in P5."
          echo "This job is manual, environment-protected and has read-only contents."
