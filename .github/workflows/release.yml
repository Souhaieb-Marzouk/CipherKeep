name: release-placeholder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: protected release placeholder
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Explain the P5 gate
        run: |
          echo "Release signing and publishing are implemented in P5."
          echo "This job is manual, environment-protected and has read-only contents."
