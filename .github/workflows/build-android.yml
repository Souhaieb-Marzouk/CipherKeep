name: build-android

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver version, for example 0.1.0
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    name: signed non-debuggable release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      CIPHERKEEP_KEYSTORE_BASE64: ${{ secrets.CIPHERKEEP_KEYSTORE_BASE64 }}
      CIPHERKEEP_KEYSTORE_PASSWORD: ${{ secrets.CIPHERKEEP_KEYSTORE_PASSWORD }}
      CIPHERKEEP_KEY_ALIAS: ${{ secrets.CIPHERKEEP_KEY_ALIAS }}
      CIPHERKEEP_KEY_PASSWORD: ${{ secrets.CIPHERKEEP_KEY_PASSWORD }}
      CIPHERKEEP_CERT_SHA256: ${{ secrets.CIPHERKEEP_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-release
        with:
          version: ${{ inputs.version }}
