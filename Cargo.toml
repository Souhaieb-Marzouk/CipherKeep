[workspace]
resolver = "2"
members = [
    "crates/cipherkeep-core",
    "crates/cipherkeep-ffi",
    "crates/cipherkeep-wasm",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Souhaieb-Marzouk/CipherKeep"
authors = ["Souhaieb Marzouk"]

[workspace.dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
data-encoding = "2.6"
getrandom = "0.2"
hkdf = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
subtle = "2.6"
thiserror = "2"
uniffi = "0.32.2"
wasm-bindgen = "0.2"
zeroize = { version = "1.8", features = ["alloc"] }

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
overflow-checks = true
debug-assertions = false
strip = "symbols"
